name: Push master
run-name: ${{ github.event.number }} 🚀 ${{ github.event.head_commit.message }}
on:
  push:
    branches:
      - master

# Self-contained copy of cureskin/devops-workflows/.github/actions/docker-build-push:
# this repo is a public fork and cannot resolve actions from the private
# devops-workflows repo, so the steps are inlined with public actions only.
jobs:
  build:
    runs-on: self-hosted
    concurrency:
      group: push-master-build-image
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and Push multi-arch with SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: healloinc/cache-http:latest
          provenance: true
          sbom: true
          cache-from: type=registry,ref=healloinc/cache-http:buildcache
          cache-to: type=registry,ref=healloinc/cache-http:buildcache,mode=max
